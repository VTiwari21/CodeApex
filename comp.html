<!DOCTYPE html>
<html>
<head>
  <title>CodeMaster Hub — Compiler</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="compStyle.css">
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="logo" >Code<span>Apex</span> Hub</a>
    <span class="topbar-badge">compiler</span>
  </div>
  <div class="topbar-right">
    <a href="index.html" class="nav-link">← Home</a>
    <button class="toggle-btn" id="toggleBtn" onclick="ref()">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="2" width="6" height="12" rx="1" fill="currentColor" opacity="0.6"/>
        <rect x="9" y="2" width="6" height="12" rx="1" fill="currentColor"/>
      </svg>
      Reference
    </button>
  </div>
</div>

<!-- Main Split Layout -->
<div class="split-container">

  <!-- Left: Compiler -->
  <div class="compiler-pane">

    <div class="page-header">
      <div class="page-title">Code<span>Apex</span> Compiler</div>
      <div class="page-subtitle">Write, run, and test code directly in your browser</div>
    </div>

    <div class="field">
      <label class="field-label">Language</label>
      <select id="language">
        <option value="50">C</option>
        <option value="54">C++</option>
        <option value="62">Java</option>
        <option value="71">Python</option>
        <option value="51">C#</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Code</label>
      <textarea id="code" rows="14" spellcheck="false">// Write your code here
</textarea>
    </div>

    <div class="field">
      <label class="field-label">Input (stdin) — one value per line</label>
      <textarea id="stdin" rows="4" placeholder="Enter program input here..."></textarea>
    </div>

    <button class="run-btn" id="runBtn" onclick="runCode()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M3 2l8 4.5L3 11V2z" fill="currentColor"/>
      </svg>
      Run Code
    </button>

    <div class="output-wrap">
      <div class="output-header">
        <div class="output-dot" id="outputDot"></div>
        <span class="output-title">Output</span>
      </div>
      <pre id="output">Output will appear here...</pre>
    </div>

  </div>

  <!-- Divider -->
  <div class="divider" id="divider"></div>

</div>

<script>
 
  function tab(){
 window.open('index.html','_blank');
  }
function ref(){
  window.open('https://chatgpt.com', '_blank');
}

//--------------NEW THINGS------------------------------------------------------------
 
const JUDGE0_URL =
    "https://ce.judge0.com/submissions/?base64_encoded=false&wait=true";

async function runCode() {
    const code = document.getElementById("code").value;
    const languageId = Number(document.getElementById("language").value);
    const stdin = document.getElementById("stdin").value;

    const output = document.getElementById("output");
    const dot = document.getElementById("outputDot");
    const btn = document.getElementById("runBtn");

    // 1. Validate input
    if (!code.trim()) {
        output.textContent = "Please enter some code first.";
        output.className = "error";
        dot.className = "output-dot error";
        return;
    }

    // 2. Show loading state
    output.textContent = "Compiling and running your code...";
    output.className = "";
    dot.className = "output-dot";
    btn.disabled = true;

    btn.innerHTML = `
        <svg width="13" height="13" viewBox="0 0 13 13"
             style="animation: spin 1s linear infinite">
            <circle cx="6.5" cy="6.5" r="5"
                    stroke="currentColor" stroke-width="1.5"
                    fill="none" stroke-dasharray="20 12"/>
        </svg>
        Running...
    `;

    try {
        // 3. Send code to Judge0
        const response = await fetch(JUDGE0_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                source_code: code,
                language_id: languageId,
                stdin: stdin
            })
        });

        // 4. Check HTTP response
        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || `Judge0 HTTP error: ${response.status}`
            );
        }

        // 5. Check the actual execution status
        const statusId = result.status?.id;
        const statusText = result.status?.description || "Unknown status";

        let message = "";
        let isError = false;

        if (statusId === 3) {
            // Accepted: execution completed successfully
            message = result.stdout ?? "";

            if (message.length === 0) {
                message = "Program executed successfully with no output.";
            }
        } else if (statusId === 1 || statusId === 2) {
            message = `Execution is still pending: ${statusText}`;
            isError = true;
        } else {
            // Compilation error, runtime error, timeout, etc.
            message =
                result.compile_output ||
                result.stderr ||
                result.message ||
                `Execution failed: ${statusText}`;

            isError = true;
        }

        // 6. Display the result
        output.textContent = message;
        output.className = isError ? "error" : "success";

        dot.className = isError
            ? "output-dot error"
            : "output-dot success";

    } catch (error) {
        // 7. Handle network and API errors
        output.textContent = `Error: ${error.message}`;
        output.className = "error";
        dot.className = "output-dot error";

    } finally {
        // 8. Always restore the Run button
        btn.disabled = false;

        btn.innerHTML = `
            <svg width="13" height="13" viewBox="0 0 13 13">
                <path d="M3 2l8 4.5L3 11V2z"
                      fill="currentColor"/>
            </svg>
            Run Code
        `;
    }
}

</script>

</body>
</html>
