<!DOCTYPE html>
<html>
<head>
  <title>CodeMaster Hub — Compiler</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="compStyle.css">
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="logo" >Code<span>Apex</span> Hub</a>
    <span class="topbar-badge">compiler</span>
  </div>
  <div class="topbar-right">
    <a href="index.html" class="nav-link">← Home</a>
    <button class="toggle-btn" id="toggleBtn" onclick="ref()">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="2" width="6" height="12" rx="1" fill="currentColor" opacity="0.6"/>
        <rect x="9" y="2" width="6" height="12" rx="1" fill="currentColor"/>
      </svg>
      Reference
    </button>
  </div>
</div>

<!-- Main Split Layout -->
<div class="split-container">

  <!-- Left: Compiler -->
  <div class="compiler-pane">

    <div class="page-header">
      <div class="page-title">Code<span>Apex</span> Compiler</div>
      <div class="page-subtitle">Write, run, and test code directly in your browser</div>
    </div>

    <div class="field">
      <label class="field-label">Language</label>
      <select id="language">
        <option value="50">C</option>
        <option value="54">C++</option>
        <option value="62">Java</option>
        <option value="71">Python</option>
        <option value="51">C#</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Code</label>
      <textarea id="code" rows="14" spellcheck="false">// Write your code here
</textarea>
    </div>

    <div class="field">
      <label class="field-label">Input (stdin) — one value per line</label>
      <textarea id="stdin" rows="4" placeholder="Enter program input here..."></textarea>
    </div>

    <button class="run-btn" id="runBtn" onclick="runCode()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M3 2l8 4.5L3 11V2z" fill="currentColor"/>
      </svg>
      Run Code
    </button>

    <div class="output-wrap">
      <div class="output-header">
        <div class="output-dot" id="outputDot"></div>
        <span class="output-title">Output</span>
      </div>
      <pre id="output">Output will appear here...</pre>
    </div>

  </div>

  <!-- Divider -->
  <div class="divider" id="divider"></div>

</div>
<script src="compiler.js" defer></script>
</body>
</html>
